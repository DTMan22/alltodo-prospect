<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alltodo-prospect — recherche locale</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem}
input,select{padding:.5rem;margin:.25rem}
table{border-collapse:collapse;width:100%;margin-top:1rem}
td,th{border:1px solid #ddd;padding:.4rem;font-size:.85rem}
</style>
</head>
<body>
<h1>alltodo-prospect (isolé)</h1>
<p>Charge un JSON généré par <code>fetch_zefix_lindas.py</code>. 100% local, aucune donnée envoyée.</p>
<input type="file" id="f" accept=".json">
<input id="q" placeholder="Filtrer : raison sociale, commune, NOGA...">
<table><thead><tr><th>Raison sociale</th><th>Commune</th><th>Adresse</th><th>Type</th><th>Source</th></tr></thead>
<tbody id="tbody"></tbody></table>
<script>
let rows=[];
document.getElementById('f').addEventListener('change',e=>{
  const r=new FileReader();
  r.onload=()=>{rows=JSON.parse(r.result);render('');};
  r.readAsText(e.target.files[0]);
});
document.getElementById('q').addEventListener('input',e=>render(e.target.value.toLowerCase()));
function render(q){
  const tb=document.getElementById('tbody');tb.innerHTML='';
  rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).slice(0,500).forEach(r=>{
    const tr=document.createElement('tr');
    [r.raison_sociale,r.commune,r.adresse,r.forme_juridique,r.source].forEach(v=>{
      const td=document.createElement('td');td.textContent=v||'';tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}
</script>
</body>
</html>
