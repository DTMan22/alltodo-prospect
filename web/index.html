<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>alltodo-prospect — Prospection suisse</title>
<style>
*{box-sizing:border-box}
:root{--teal:#0f766e;--bg:#f4f6f5;--card:#fff;--txt:#1a1a1a;--mut:#64748b}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:10;background:var(--teal);color:#fff;padding:.9rem 1rem calc(.9rem + env(safe-area-inset-top));padding-top:calc(.9rem + env(safe-area-inset-top))}
header h1{font-size:1.1rem;margin:0 0 .6rem}
header p{font-size:.75rem;margin:0 0 .6rem;opacity:.85}
.searchrow{display:flex;gap:.5rem}
.searchrow input,.searchrow select{flex:1;min-width:0;font-size:1rem;padding:.7rem;border:0;border-radius:.6rem}
.searchrow select{flex:0 0 9rem}
#status{font-size:.8rem;color:var(--mut);padding:.6rem 1rem 0}
main{padding:.6rem 1rem calc(2rem + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
.grid{display:grid;gap:.7rem;grid-template-columns:1fr}
.card{background:var(--card);border-radius:.8rem;padding:.9rem;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:1rem;margin:0 0 .25rem}
.badge{display:inline-block;font-size:.7rem;background:#ccfbf1;color:#115e59;border-radius:99px;padding:.15rem .55rem;margin:.15rem .25rem .15rem 0}
.loc{font-size:.85rem;color:var(--mut);margin:.2rem 0 .6rem}
.actions{display:flex;gap:.5rem;margin-top:.5rem}
.actions a{flex:1;text-align:center;text-decoration:none;font-size:.9rem;font-weight:600;padding:.65rem .4rem;border-radius:.6rem;min-height:44px;display:flex;align-items:center;justify-content:center}
.call{background:var(--teal);color:#fff}
.mail{background:#e2e8f0;color:#1e293b}
.nocontact{font-size:.8rem;color:var(--mut)}
footer{padding:1rem;font-size:.75rem;color:var(--mut);text-align:center}
/* Tablette / desktop : grille multi-colonnes */
@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <h1>alltodo-prospect</h1>
  <p>Données publiques B2B — usage ciblé uniquement, opt-out systématique (nLPD/LCD).</p>
  <div class="searchrow">
    <input id="q" type="search" placeholder="Nom, commune, métier…" autocomplete="off">
    <select id="src"><option value="">Sources</option></select>
  </div>
</header>
<p id="status">Chargement…</p>
<main><div class="grid" id="grid"></div></main>
<footer>Charger un autre JSON : <input type="file" id="f" accept=".json"></footer>
<script>
let rows=[], apiMode=false, total=0;
const grid=document.getElementById('grid'),st=document.getElementById('status'),
      q=document.getElementById('q'),src=document.getElementById('src');
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function telLink(t){const c=String(t||'').split(';')[0].trim().replace(/[\s.]/g,'');return c?'<a class="call" href="tel:'+esc(c)+'">Appeler</a>':'';}
function mailLink(m){const e=String(m||'').split(';')[0].trim();return e?'<a class="mail" href="mailto:'+esc(e)+'">Email</a>':'';}
function cards(list){
  return list.map(r=>{
    const metier=r.noga_label||r.noga||r.category||r.forme||'—';
    const btns=telLink(r.telephone)+mailLink(r.email);
    return '<article class="card"><h2>'+esc(r.raison_sociale||'(sans nom)')+'</h2>'+
    '<span class="badge">'+esc(metier)+'</span>'+
    '<span class="badge">'+esc(r.commune||'?')+'</span>'+
    (r.adresse?'<div class="loc">'+esc(r.adresse)+'</div>':'')+
    (btns?'<div class="actions">'+btns+'</div>':'<div class="nocontact">Pas de contact direct — voir fiche locale.</div>')+
    '</article>';}).join('');
}
function renderLocal(){
  const f=q.value.toLowerCase(),s=src.value;
  const list=rows.filter(r=>(!s||String(r.source||'').startsWith(s))&&JSON.stringify(r).toLowerCase().includes(f)).slice(0,300);
  grid.innerHTML=cards(list);
  st.textContent=rows.length.toLocaleString('fr-CH')+' prospects (mode hors-ligne) — '+list.length+' affichés (max 300).';
}
async function renderApi(){
  const p=new URLSearchParams({q:q.value,source:src.value,limit:300});
  try{
    const r=await fetch('/api/search?'+p);const d=await r.json();
    grid.innerHTML=cards(d.rows||[]);
    st.textContent=total.toLocaleString('fr-CH')+' entreprises en base — '+(d.rows||[]).length+' affichées.';
  }catch(e){st.textContent='API injoignable.';}
}
function render(){apiMode?renderApi():renderLocal();}
function fillSources(names){
  names.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;src.appendChild(o);});
}
async function boot(){
  try{
    const r=await fetch('/api/stats');
    if(!r.ok)throw 0;
    const d=await r.json();
    apiMode=true;total=d.total||0;
    fillSources((d.sources||[]).map(s=>String(s.source).split(':')[0]));
    renderApi();
  }catch(e){
    try{
      const r=await fetch('data/prospects.json');rows=await r.json();
      fillSources([...new Set(rows.map(r=>String(r.source||'').split(':')[0]).filter(Boolean))]);
      renderLocal();
    }catch(e2){st.textContent='Aucune donnée — utilisez le sélecteur de fichier.';}
  }
}
boot();
let t;q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,apiMode?300:120);});
src.addEventListener('change',render);
document.getElementById('f').addEventListener('change',e=>{
  const rd=new FileReader();rd.onload=()=>{apiMode=false;rows=JSON.parse(rd.result);renderLocal();};rd.readAsText(e.target.files[0]);});
</script>
</body>
</html>
